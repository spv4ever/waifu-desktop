# ==========================================================
# WAIFU PROMPT CATALOG — KEIKODEV
# ==========================================================

defaults:
  lock_steps: true
  steps: 50
  base_subject: "adult anime woman"
  quality_tags:
    - high quality
    - ultra detailed
    - sharp focus
    - clean linework
    - professional illustration

negative_prompt: >
  low quality, blurry, out of focus, bad anatomy, bad hands,
  extra fingers, deformed hands,
  same face, identical face, generic face, cloned face,
  doll-like face, plastic skin,
  watermark, text, logo, jpeg artifacts, oversharpening

# =========================
# RATIOS DISPONIBLES
# =========================
ratios:
  "1:1":  { width: 1024, height: 1024, tag: "1x1" }
  "3:4":  { width: 896,  height: 1152, tag: "3x4" }
  "9:16": { width: 720,  height: 1280, tag: "9x16" }
  "16:9": { width: 1280, height: 720,  tag: "16x9" }

# =========================
# CATEGORÍAS PRINCIPALES
# =========================
categories:

  casual:
    label: "Casual"
    commercial_goal: "Entrada, volumen, uso diario"
    enabled: true
    allowed_ratios: ["1:1", "3:4", "9:16"]
    base_prompt: >
      modern slice-of-life anime illustration of an adult woman,
      distinct facial features with subtle asymmetry,
      natural skin shading and soft blush tones,
      relaxed everyday styling in a candid moment,
      soft daylight with gentle bounce light,
      shallow depth of field, 50mm look,
      clean linework and rich but natural color grading

  fantasy:
    label: "Fantasy"
    commercial_goal: "Valor artístico"
    enabled: true
    allowed_ratios: ["1:1", "3:4", "16:9"]
    base_prompt: >
      high-fantasy anime illustration of an adult heroine,
      distinctive face structure and expressive eyes,
      intricate costume design with symbolic accessories,
      magical environment with atmospheric depth,
      cinematic lighting with volumetric rays,
      35mm look, dramatic rim light,
      painterly detail combined with crisp edges

  cyberpunk:
    label: "Cyberpunk"
    commercial_goal: "Estética moderna"
    enabled: true
    allowed_ratios: ["1:1", "9:16", "16:9"]
    base_prompt: >
      cyberpunk anime portrait of an adult woman,
      unique facial silhouette with sharp highlights,
      neon reflections on skin and wet specular lighting,
      futuristic city background with holographic signage,
      high-contrast lighting and deep shadows,
      50mm look, shallow depth of field,
      cinematic teal and magenta color palette

  school:
    label: "School"
    commercial_goal: "Alta demanda / nostalgia"
    enabled: true
    allowed_ratios: ["1:1", "3:4"]
    base_prompt: >
      slice-of-life anime scene featuring an adult student character (college age),
      distinctive facial proportions and gentle expression,
      natural makeup and soft shading,
      tidy school uniform with realistic fabric folds,
      bright overcast daylight with soft shadows,
      50mm look, warm pastel color palette

  streetwear:
    label: "Streetwear"
    commercial_goal: "Tendencia / redes"
    enabled: true
    allowed_ratios: ["1:1", "9:16"]
    base_prompt: >
      contemporary anime fashion editorial of an adult woman,
      distinctive facial features and confident attitude,
      layered streetwear outfit with visible textures and stitching,
      urban environment with strong perspective lines,
      directional sunlight with rim light,
      35mm look, dynamic framing,
      crisp linework and modern color grading

  beach:
    label: "Beach / Summer"
    commercial_goal: "Estacional"
    enabled: true
    allowed_ratios: ["1:1", "3:4", "9:16"]
    base_prompt: >
      summer anime lifestyle scene of an adult woman,
      distinctive face and natural relaxed expression,
      sunlit skin shading with warm highlights,
      beach environment with atmospheric haze,
      gentle wind movement in hair and fabric,
      golden hour sunlight, 35mm look,
      soft lens flare and vibrant summer colors

  goth:
    label: "Goth / Dark"
    commercial_goal: "Nicho premium"
    enabled: true
    allowed_ratios: ["1:1", "3:4"]
    base_prompt: >
      dark gothic anime portrait of an adult woman,
      unique facial structure with dramatic makeup,
      textured fabrics such as lace and velvet,
      moody environment with candles or stained-glass accents,
      low-key lighting with strong rim light,
      50mm look, deep shadows,
      restrained monochrome palette with crimson accents

  elegant:
    label: "Elegant / Date"
    commercial_goal: "Refinado / marketing"
    enabled: true
    allowed_ratios: ["1:1", "3:4"]
    base_prompt: >
      elegant anime studio portrait of an adult woman,
      distinctive face proportions and refined expression,
      premium fashion styling with subtle jewelry,
      controlled studio lighting setup (key, fill, rim),
      clean shadow definition and smooth gradients,
      85mm look, shallow depth of field,
      high-end editorial finish
  
  glamour:
    label: "Glamour"
    commercial_goal: "Sensual premium / editorial"
    enabled: true
    allowed_ratios: ["1:1", "3:4"]
    base_prompt: >
      sensual anime glamour portrait of an adult woman,
      distinctive facial structure with confident expression,
      subtle makeup emphasizing eyes and lips,
      elegant yet alluring outfit highlighting body contours,
      soft skin highlights with controlled specular lighting,
      intimate studio atmosphere with shallow depth of field,
      85mm look, refined editorial composition,
      premium fashion photography aesthetic

  intimate:
    label: "Intimate"
    commercial_goal: "Sensual / mood nocturno"
    enabled: true
    allowed_ratios: ["1:1", "3:4"]
    base_prompt: >
      intimate anime full-body illustration of an adult woman,
      confident yet soft body language with subtle sensual posture,
      natural curves emphasized through pose rather than exaggeration,
      bare shoulders or exposed collarbone suggesting intimacy,
      delicate fabric softly draped over the body with realistic folds,
      warm skin tones with gentle specular highlights,
      low-key cinematic lighting creating a private, quiet atmosphere,
      shallow depth of field separating the subject from the background,
      50mm look, smooth tonal transitions, refined adult aesthetic
  
  nightlife:
    label: "Nightlife"
    commercial_goal: "Sexy urbano / redes"
    enabled: true
    allowed_ratios: ["1:1", "9:16"]
    base_prompt: >
      nightlife anime portrait of an adult woman,
      confident and alluring presence with bold expression,
      stylish evening outfit with reflective fabrics,
      neon and ambient lighting creating glossy skin highlights,
      urban night environment with shallow depth of field,
      dynamic composition with cinematic contrast,
      35mm look, modern nightlife aesthetic

  romantic:
    label: "Romantic"
    commercial_goal: "Sensual suave / wallpapers"
    enabled: true
    allowed_ratios: ["1:1", "3:4"]
    base_prompt: >
      romantic anime portrait of an adult woman,
      gentle yet captivating expression with soft eye contact,
      flowing fabric interacting with body movement,
      warm lighting enhancing natural skin tones,
      intimate atmosphere with soft focus background,
      cinematic 50mm look with dreamy highlights

  
  

# =========================
# IDENTIDAD FACIAL (ANTI SAME-FACE)
# =========================
identity:
  face_features:
    - heart-shaped face with soft cheekbones
    - oval face with high cheekbones
    - square jawline with a strong chin
    - round face with gentle cheeks
    - sharp jawline with a narrow chin
    - prominent cheekbones and elegant nose bridge

  eye_styles:
    - almond-shaped eyes with bright catchlights
    - slightly hooded eyes with subtle eyeliner
    - large expressive eyes with soft gradient irises
    - narrow confident eyes with sharp highlights
    - gentle eyes with a warm gaze

  hair:
    colors:
      - jet black
      - chestnut brown
      - ash brown
      - platinum blonde
      - silver
      - auburn
      - deep blue
      - rose pink
    styles:
      - long wavy hair
      - short bob cut
      - twin tails
      - high ponytail
      - messy bun
      - braided hair
      - shoulder-length straight hair
    details:
      - loose strands framing the face
      - soft flyaway hair
      - wind-swept hair
      - neat bangs
      - side-swept bangs

# =========================
# CÁMARA / COMPOSICIÓN
# =========================
camera:
  focal_lengths:
    - 35mm look
    - 50mm look
    - 85mm look
  framing:
    - medium shot
    - three-quarter shot
    - close-up portrait
  angle:
    - eye-level angle
    - slight low angle
    - slight high angle

# =========================
# MOOD / ACTITUD
# =========================
mood:
  - calm, introspective mood
  - playful, cheerful mood
  - confident, bold mood
  - soft romantic mood
  - mysterious, dramatic mood

# =========================
# MODULADORES COMBINABLES
# =========================
wardrobe:
  tops: [hoodie, t-shirt, sweater, blouse, crop top]
  bottoms: [jeans, skirt, shorts, leggings]
  dresses: [casual dress, elegant dress, summer dress]
  extras: [jacket, cardigan, oversized hoodie]

footwear:
  casual: [sneakers, flats]
  elegant: [heels, ankle boots]
  urban: [high-top sneakers, chunky shoes]
  fantasy: [leather boots, armored boots]

pose:
  neutral: [standing, relaxed pose]
  dynamic: [walking, slight movement]
  cute: [playful, cheerful expression]
  elegant: [confident pose, graceful posture]

background:
  urban: [city street, urban background]
  interior: [cozy room, cafe interior]
  nature: [park, forest, beach]
  fantasy: [fantasy landscape, magical ruins]
  minimal: [simple background, soft gradient]

lighting:
  soft: [soft natural lighting]
  cinematic: [cinematic lighting, rim light]
  night: [neon lighting, night scene]
  studio: [studio lighting, clean shadows]
