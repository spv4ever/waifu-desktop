# ==========================================================
# WAIFU PROMPT CATALOG — KEIKODEV
# ==========================================================

defaults:
  lock_steps: true
  steps: 50
  base_subject: "adult anime woman"
  quality_tags:
    - high quality
    - ultra detailed
    - sharp focus
    - clean linework
    - professional illustration

negative_prompt: >
  low quality, blurry, out of focus, bad anatomy, bad hands,
  extra fingers, deformed hands,
  same face, identical face, generic face, cloned face,
  doll-like face, plastic skin,
  watermark, text, logo, jpeg artifacts, oversharpening

# =========================
# TÍTULOS DEMO PARA REELS
# =========================
reel_titles:
  default:
    - "{category} vibes of the day"
    - "{category} moments in high definition"
    - "{category} spotlight: light, attitude, and style"
    - "{category} inspiration for your mood"
    - "{category} edition — details that captivate"
    - "{category} route: looks and feelings"
    - "Fresh {category} energy for today"
    - "{category} highlights you can't miss"
    - "Signature {category} looks in focus"
    - "{category} moodboard: bold and beautiful"
    - "New {category} favorites this week"

# =========================
# RATIOS DISPONIBLES
# =========================
ratios:
  "1:1":  { width: 1024, height: 1024, tag: "1x1" }
  "3:4":  { width: 896,  height: 1152, tag: "3x4" }
  "9:16": { width: 720,  height: 1280, tag: "9x16" }
  "16:9": { width: 1280, height: 720,  tag: "16x9" }

